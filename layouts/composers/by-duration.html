{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul>
  {{ range sort (where .Site.RegularPages "Section" "composers") ".Params.duration_minutes" }}
  <li><a href="{{ .Permalink }}">{{ .Title }}</a>{{ with .Params.duration_minutes }} — {{ . }} minutes{{ end }}</li>
  {{ end }}
</ul>
{{ end }}
