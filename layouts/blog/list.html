{{ define "main" }}
<h1>Blog about Stabat Mater</h1>
<div class="blog-grid">
  {{ range .Pages }}
  <div class="blog-card">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <div class="date">{{ .Date.Format "02-01-2006" }}</div>
    <p>{{ .Summary }}</p>
  </div>
  {{ end }}
</div>
{{ end }}
