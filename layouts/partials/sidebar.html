<aside class="sidebar">

  <div class="sidebar-donate">
    <img src="{{ "images/donate-banner.jpg" | relURL }}" alt="Support banner preview" style="width:100%; border-radius:4px; display:block;">
  </div>

  <div class="sidebar-widget">
    <h3>Recent blog posts</h3>
    <ul style="list-style:none; padding:0;">
      {{ range first 5 (where .Site.RegularPages "Section" "blog") }}
      <li style="margin-bottom:0.5rem; font-size:0.85rem;">
        <a href="{{ .Permalink }}">{{ .Title }}</a>
        <div style="font-size:0.75rem; color:#999;">{{ .Date.Format "02-01-2006" }}</div>
      </li>
      {{ end }}
    </ul>
  </div>

  <div class="sidebar-widget">
    <h3>Sections</h3>
    <ul style="list-style:none; padding:0; font-size:0.85rem;">
      <li><a href="{{ "composers/" | absURL }}">Composers</a></li>
      <li><a href="{{ "texts/" | absURL }}">Texts</a></li>
      <li><a href="{{ "translations/" | absURL }}">Translations</a></li>
      <li><a href="{{ "blog/" | absURL }}">Blog</a></li>
      <li><a href="{{ "about/" | absURL }}">About</a></li>
      <li><a href="{{ "contact/" | absURL }}">Contact</a></li>
    </ul>
  </div>

</aside>
