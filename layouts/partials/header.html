<div class="topbar">
  <a href="https://stabatmater.info/stabat-mater-collection-support/">Donate</a>
  <a href="https://www.instagram.com/stabatmater.info/" aria-label="Instagram">Instagram</a>
  <a href="https://www.youtube.com/channel/UCPUZ1hgQgIIYQeMqoJWWoXw" aria-label="YouTube">YouTube</a>
  <a href="https://twitter.com/StabatMaterSite" aria-label="Twitter">Twitter</a>
</div>

<header class="site-header">
  <a href="{{ "" | absURL }}" class="site-logo-link">
    <img class="site-logo" src="{{ "images/logo.png" | relURL }}" alt="The Ultimate Stabat Mater Website">
  </a>
  <a href="{{ "" | absURL }}" class="site-title-link">
    <h1 class="site-title">The Ultimate Stabat Mater Website</h1>
    <p class="site-subtitle">a musical journey through the ages</p>
  </a>
</header>

<div class="hero-banner">
  <img src="{{ "images/hero.jpg" | relURL }}" alt="Stabat Mater banner" class="hero-image">
</div>

<nav class="main-nav">
  <ul>
    {{ range .Site.Menus.main }}
      {{ if not .Parent }}
      <li class="{{ if .HasChildren }}has-children{{ end }}">
        <a href="{{ .URL | absURL }}"{{ if eq $.RelPermalink (.URL | relURL) }} class="active"{{ end }}>{{ .Name }}</a>
        {{ if .HasChildren }}
        <ul class="sub-menu">
          {{ range .Children }}
          <li><a href="{{ .URL | absURL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
        {{ end }}
      </li>
      {{ end }}
    {{ end }}
  </ul>
</nav>
