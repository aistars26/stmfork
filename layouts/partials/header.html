<div class="test-banner">⚠ TEST SITE — GitHub Pages proof of concept for the Stabat Mater website.</div>

<div class="topbar">
  <a href="/about/">About</a>
  <a href="/blog/">Blog</a>
  <a href="/contact/">Contact</a>
</div>

<header class="site-header">
  <a href="{{ "/" | relURL }}" class="site-logo-link">
    <img class="site-logo" src="{{ "images/logo.png" | relURL }}" alt="The Ultimate Stabat Mater Website">
  </a>
  <a href="{{ "/" | relURL }}" class="site-title-link">
    <h1 class="site-title">The Ultimate Stabat Mater Website</h1>
    <p class="site-subtitle">a musical journey through the ages</p>
  </a>
</header>

<div class="hero-banner">
  <img src="{{ "images/hero.jpg" | relURL }}" alt="Stabat Mater banner" class="hero-image">
</div>

<nav class="main-nav">
  <ul>
    {{ range .Site.Menus.main }}
    <li>
      <a href="{{ .URL | relURL }}"{{ if eq $.RelPermalink (.URL | relURL) }} class="active"{{ end }}>{{ .Name }}</a>
    </li>
    {{ end }}
  </ul>
</nav>
